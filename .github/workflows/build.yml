name: Windows EXE Oluştur

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller kur
        run: pip install pyinstaller

      - name: EXE oluştur
        run: pyinstaller --onefile --name DFF "gündem.py"

      - name: EXE'yi hazırla
        uses: actions/upload-artifact@v4
        with:
          name: DFF-Windows
          path: dist/DFF.exe
